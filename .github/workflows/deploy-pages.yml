name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; a new push cancels an in-flight deploy rather
# than queueing behind it, since only the latest commit's build should ever
# ship.
concurrency:
  group: pages
  cancel-in-progress: true

# build -> quality -> deploy, so a failing quality gate blocks the deploy.
# build and quality also run on pull requests (as PR status checks), but
# deploy is gated to push events only -- see the deploy job's `if:` below.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Dozens of test files already existed but `npm test` was never wired
      # into CI -- the highest-value single line in this file.
      - name: Run test suite
        run: npm test

      # NOTE: LICHESS_API_TOKEN stays required here for now -- every
      # content-bearing page is still built from live Opening Explorer calls
      # at build time. Removing this token (and asserting the build succeeds
      # without it) only makes sense once a database-dump ingestion pipeline
      # and the data-layer migration off the live API have both shipped.
      # Until then, removing this would break every deploy.
      - name: Build site
        run: npm run build:static
        env:
          LICHESS_API_TOKEN: ${{ secrets.LICHESS_API_TOKEN }}

      - name: Check internal links
        run: node scripts/checkLinks.js dist

      - name: Validate HTML
        run: npx html-validate "dist/**/*.html"

      # --skip-aggregates: this job's checkout can have
      # data/aggregates/manifest.json (git-tracked once ingest-dump.yml has
      # committed one back) without the shards it lists (git-ignored,
      # published as a GitHub Release asset instead -- see .gitignore and
      # scripts/verifyAggregates.js's header comment). This build doesn't
      # read raw shards off disk at all today, so checking for them here
      # would fail every deploy on a "missing shard" that isn't actually a
      # problem -- the dist/-level checks below are the ones that matter
      # for what this job actually ships.
      - name: Verify data-sanity gates
        run: node scripts/verifyAggregates.js dist --skip-aggregates

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

      # A second, ordinary (non-Pages) copy of the same dist/ output so the
      # quality job below can download and audit it -- the Pages artifact
      # uploaded above is consumed directly by actions/deploy-pages and
      # isn't meant to be downloaded by another job.
      - name: Upload dist for quality job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-for-quality
          path: dist
          retention-days: 1

  quality:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download dist from build job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-for-quality
          path: dist

      - name: Resolve installed Playwright version
        id: playwright-version
        run: echo "version=$(node -e "console.log(require('./node_modules/playwright/package.json').version)")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS dependencies only (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Enforce Lighthouse budget
        run: node scripts/lighthouseBudget.js dist

  deploy:
    needs: quality
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
